<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>AnilistStream</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div class="page">
            <header class="site-header">
                <div class="container header-inner">
                    <a href="/" class="brand">
                        <span>AnilistStream</span>
                    </a>
                </div>
            </header>

            <main>
                <section class="hero">
                    <div class="container">
                        <div class="hero-label">Stremio addon</div>
                        <h1>Anime streaming with AniList sync.</h1>
                        <p class="hero-description">
                            Watch your favorite anime through Stremio while
                            keeping your AniList progress automatically updated.
                        </p>
                        <div class="hero-actions">
                            <a href="/configure" class="button button-primary">
                                Install addon <span>→</span>
                            </a>
                            <a
                                href="https://github.com/Saadiq8149/AnilistStream"
                                class="button"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                GitHub ↗
                            </a>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </body>
</html>
